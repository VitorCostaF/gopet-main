server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gopet-java-api
  # Flyway nunca migra sozinho no boot — só via `mvn flyway:migrate` explícito (ver pom.xml).
  flyway:
    enabled: false

# Provider de envio de WhatsApp: zapi (padrão) ou evolution (self-hosted).
whatsapp:
  provider: ${WHATSAPP_PROVIDER:zapi}

# Painel Z-API > sua instância > Segurança/Instância.
zapi:
  instance-id: ${ZAPI_INSTANCE_ID:}
  token: ${ZAPI_TOKEN:}
  client-token: ${ZAPI_CLIENT_TOKEN:}

# Evolution API self-hospedada — https://github.com/EvolutionAPI/evolution-api
# Usado quando WHATSAPP_PROVIDER=evolution.
evolution:
  base-url: ${EVOLUTION_BASE_URL:}
  instance: ${EVOLUTION_INSTANCE:}
  api-key: ${EVOLUTION_API_KEY:}

# Backend de persistência da reserva: supabase (REST/PostgREST, padrão) ou postgres (JDBC direto).
reserva:
  store: ${RESERVA_STORE:supabase}

# Painel Supabase > Settings > API. Sem essas variáveis, POST /reservas roda em modo demo (sem persistir).
# Usado quando RESERVA_STORE=supabase.
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# Conexão direta com o Postgres — usada só quando RESERVA_STORE=postgres.
db:
  url: ${DB_URL:}
  username: ${DB_USERNAME:}
  password: ${DB_PASSWORD:}

# MySQL — histórico de consultas de CEP (tabela consultas_cep, migração em
# src/main/resources/db/migration, aplicada via `mvn flyway:migrate`).
# Sem MYSQL_URL, o histórico simplesmente não é gravado (GET /cobertura segue funcionando normalmente).
mysql:
  url: ${MYSQL_URL:}
  username: ${MYSQL_USERNAME:}
  password: ${MYSQL_PASSWORD:}

# Origens do front-end autorizadas a chamar esta API direto do navegador (separadas por vírgula).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Auth0 — valida o access token no POST /reservas (Resource Server) e usa o "sub" do token
# como tutor_id real, em vez de confiar no valor enviado pelo corpo da requisição (ver
# SecurityConfig e ReservaController). Sem AUTH0_DOMAIN configurado, a API roda sem exigir
# autenticação (mesmo comportamento de antes desta integração), pra continuar subindo sem
# depender de um tenant Auth0 em dev/local.
auth0:
  domain: ${AUTH0_DOMAIN:}
  # Identifier da API cadastrada no Auth0 (Applications > APIs > Identifier), usado como
  # audience esperada no token. Precisa ser IGUAL ao AUTH0_AUDIENCE configurado no Next.js
  # (ver .env.example na raiz do projeto) — é o mesmo valor dos dois lados.
  audience: ${AUTH0_AUDIENCE:}

# CEP de referência (base) da GO PET e raio de atendimento a partir dele.
# Geolocalização por CEP tenta, nessa ordem: BrasilAPI -> Geoapify -> Nominatim (ver CepGeolocalizacaoConfig).
cobertura:
  cep-base: ${COBERTURA_CEP_BASE:}
  raio-km: ${COBERTURA_RAIO_KM:2}
  geoapify:
    # https://www.geoapify.com/ > My Projects > sua API key. Sem isso, o provider Geoapify é pulado.
    api-key: ${GEOAPIFY_API_KEY:}

logging:
  level:
    com.gopet: DEBUG
  file:
    name: logs/gopet-api.log
