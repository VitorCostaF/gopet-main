server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gopet-java-api

# Painel Z-API > sua instância > Segurança/Instância.
zapi:
  instance-id: ${ZAPI_INSTANCE_ID:}
  token: ${ZAPI_TOKEN:}
  client-token: ${ZAPI_CLIENT_TOKEN:}

# Painel Supabase > Settings > API. Sem essas variáveis, POST /reservas roda em modo demo (sem persistir).
supabase:
  url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# Origens do front-end autorizadas a chamar esta API direto do navegador (separadas por vírgula).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# CEP de referência (base) da GO PET e raio de atendimento a partir dele.
cobertura:
  cep-base: ${COBERTURA_CEP_BASE:04321000}
  raio-km: ${COBERTURA_RAIO_KM:8}
